# Continuous Integration pipeline. Procedure:
# 1a. Assemble
# 1b. Setup AVD cache for emulator
# 2a. Run unit tests
# 2b. Run instrumentation tests
# 3. Publish test results

name: 'Integration pipeline'

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
    - 'master'
    - 'main'

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-environment
      - name: Assemble
        run: ./gradlew assembleDebug

  setup-avd:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/setup-avd

  unit-test:
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: ./.github/actions/setup-environment

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Unit tests results upload
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-results
          path: app/build/**/TEST-*.xml

  instrumentation-test:
    runs-on: ubuntu-latest
    needs: [assemble, setup-avd]
    steps:
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/enable-kvm
      - uses: ./.github/actions/cache-avd

      - name: Instrumented Tests
        id: instrumented_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Instrumented tests results upload
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-tests-results
          path: app/build/**/TEST-*.xml

  publish-results:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    needs: [unit-test, instrumentation-test]
    steps:
      - name: Test Results Upload
        uses: actions/download-artifact@v7
        # Omitting 'name:' downloads all artifacts into the workspace

      - name: Test Results Presentation
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/TEST-*.xml