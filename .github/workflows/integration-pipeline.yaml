name: Integration-Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
    - 'master'
    - 'main'

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:  # needed for "Publish Test Results" action
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Setup Java distribution
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Add permissions for Gradle
        run: chmod +x gradlew

      - name: Assemble
        id: 'assemble'
        run: ./gradlew assembleDebug

      - name: Unit Tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented Tests
        id: instrumented_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Test Results Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/**/TEST-*.xml

      - name: Test Results Presentation
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: app/build/**/TEST-*.xml