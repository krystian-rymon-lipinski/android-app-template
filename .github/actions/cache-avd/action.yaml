name: 'Cache AVD'
description: 'Restore or save AVD cache to speed up instrumented tests'

outputs:
  cache-hit:
    description: 'true if AVD cache was hit, false otherwise'
    value: ${{ steps.avd-cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: AVD cache
      uses: actions/cache@v5
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-35