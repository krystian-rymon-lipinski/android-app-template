name: 'Setup environment'
description: 'Setup environment for a job'

runs:
  using: 'composite'
  steps:
    - name: Setup Java distribution
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Add permissions for Gradle
      run: chmod +x gradlew
      shell: bash